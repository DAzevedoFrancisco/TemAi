{% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="logout-form mobile-nav-logout-form" id="logout-form">
        {% csrf_token %}
        <button type="button" class="client-nav-item client-nav-item-logout" id="logout-btn">
            <span class="client-nav-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </span>
            <span>Sair</span>
        </button>
    </form>
{% endif %}

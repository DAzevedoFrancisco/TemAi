{% if user.is_authenticated %}
<a href="{% url 'account_settings' %}" class="client-nav-item client-nav-item-account{% if request.resolver_match.url_name == 'account_settings' %} active{% endif %}" title="{{ user.name }}">
    <span class="client-nav-account-avatar" aria-hidden="true">{{ user.first_name|slice:":1"|upper }}</span>
    <span class="client-nav-account-copy">
        <span class="client-nav-account-name">{{ user.first_name }}</span>
        <span class="client-nav-account-label">Minha conta</span>
    </span>
</a>
{% endif %}

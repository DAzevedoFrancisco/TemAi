{% extends 'vendor/base.html' %}



{% block title %}Eliminar produto{% endblock %}



{% block content %}

<div class="form-page product-form-page">

    <div class="profile-style-card product-delete-card">

        <div class="product-delete-icon" aria-hidden="true">

            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

                <polyline points="3 6 5 6 21 6"/>

                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>

            </svg>

        </div>

        <h2 class="profile-style-title">Eliminar produto</h2>

        <p class="product-delete-text">

            Tem a certeza de que deseja eliminar <strong>{{ product.name }}</strong>?

            Esta ação não pode ser desfeita.

        </p>

        <p class="product-form-subtitle">{{ establishment.name }}</p>



        <form method="post" class="product-delete-actions">

            {% csrf_token %}

            <a href="{% url 'vendor:product_list' pk=establishment.pk %}" class="btn-discard">Cancelar</a>

            <button type="submit" class="btn-save btn-save-danger">Eliminar</button>

        </form>

    </div>

</div>

{% endblock %}
